<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>A slab-serif letter whose shadow is a glowing sawtooth, marking it as machine-written</title>
  <defs>
    <!-- Deep ink void - the page before anyone has written on it -->
    <radialGradient id="void" cx="50%" cy="45%" r="70%">
      <stop offset="0%" style="stop-color:#1c1530" />
      <stop offset="55%" style="stop-color:#0d0a18" />
      <stop offset="100%" style="stop-color:#000000" />
    </radialGradient>

    <!-- Letter fill - warm paper catching light from below -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff6e0" />
      <stop offset="55%" style="stop-color:#f0d9a6" />
      <stop offset="100%" style="stop-color:#c9963e" />
    </linearGradient>

    <!-- Sawtooth fill - electric provenance -->
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3ec9" />
      <stop offset="50%" style="stop-color:#4de3ff" />
      <stop offset="100%" style="stop-color:#ff3ec9" />
    </linearGradient>

    <!-- Floor glow rising up from the mark -->
    <linearGradient id="floorGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4de3ff;stop-opacity:0.55" />
      <stop offset="60%" style="stop-color:#4de3ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#4de3ff;stop-opacity:0" />
    </linearGradient>

    <!-- Badge ring -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4de3ff" />
      <stop offset="100%" style="stop-color:#ff3ec9" />
    </linearGradient>

    <!-- Neon glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bigger, softer glow for the floor -->
    <filter id="bloom" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <!-- Slight surreal warp so the letter looks a little melted at the foot -->
    <filter id="warp">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Stars -->
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="9" r="0.5" fill="#ffffff" opacity="0.6" />
      <circle cx="28" cy="4" r="0.3" fill="#ffffff" opacity="0.4" />
      <circle cx="51" cy="17" r="0.45" fill="#ffffff" opacity="0.5" />
      <circle cx="14" cy="36" r="0.6" fill="#ffffff" opacity="0.7" />
      <circle cx="39" cy="46" r="0.3" fill="#ffffff" opacity="0.3" />
      <circle cx="55" cy="52" r="0.5" fill="#ffffff" opacity="0.5" />
      <circle cx="23" cy="55" r="0.4" fill="#ffffff" opacity="0.4" />
    </pattern>

    <!-- A single tooth, tiled to make a sawtooth stroke -->
    <pattern id="teeth" width="10" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L5 0 L10 8 Z" fill="url(#toothGrad)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#void)" />
  <rect width="100%" height="100%" fill="url(#stars)" opacity="0.8" />

  <!-- Drifting fragments of the mechanism -->
  <g opacity="0.16" font-family="monospace" font-size="9" fill="#4de3ff">
    <text x="36" y="58" transform="rotate(-14 36 58)">U+E0101</text>
    <text x="640" y="44" transform="rotate(9 640 44)">variation selector</text>
    <text x="700" y="250" transform="rotate(-7 700 250)">copy</text>
    <text x="70" y="252" transform="rotate(6 70 252)">paste</text>
    <text x="18" y="200" transform="rotate(-90 18 200)">who wrote this?</text>
    <text x="786" y="200" transform="rotate(90 786 200)">glyph level</text>
    <text x="300" y="66" transform="rotate(4 300 66)">no space, no width</text>
    <text x="540" y="248" transform="rotate(-3 540 248)">survives the clipboard</text>
  </g>

  <!-- The floor: a horizon line where the marks live -->
  <rect x="0" y="270" width="800" height="90" fill="url(#floorGlow)" />

  <!-- Spotlight cone rising from the mark to light the letter from below -->
  <path d="M320 312 L400 70 L480 312 Z" fill="#4de3ff" opacity="0.06" />

  <!-- The letter's shadow, cast as a sawtooth -->
  <g filter="url(#bloom)" opacity="0.9">
    <path d="M318 324 L328 302 L338 324 L348 302 L358 324 L368 302 L378 324 L388 302 L398 324 L408 302 L418 324 L428 302 L438 324 L448 302 L458 324 L468 302 L478 324 Z"
          fill="url(#toothGrad)" />
  </g>
  <path d="M318 324 L328 302 L338 324 L348 302 L358 324 L368 302 L378 324 L388 302 L398 324 L408 302 L418 324 L428 302 L438 324 L448 302 L458 324 L468 302 L478 324 Z"
        fill="url(#toothGrad)" filter="url(#glow)" />

  <!-- The letter itself: one honest slab-serif 'a' -->
  <g filter="url(#warp)">
    <text x="400" y="290" text-anchor="middle"
          font-family="'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif"
          font-weight="700" font-size="250"
          fill="url(#letterGrad)" stroke="#3b2a12" stroke-width="2">a</text>
  </g>
  <!-- Rim light on the letter from the mark below -->
  <text x="400" y="290" text-anchor="middle"
        font-family="'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif"
        font-weight="700" font-size="250"
        fill="none" stroke="#4de3ff" stroke-width="1.2" opacity="0.5" filter="url(#glow)">a</text>

  <!-- The sawtooth keeps going: a conveyor of marks running off both edges -->
  <g filter="url(#glow)">
    <rect x="-10" y="338" width="820" height="8" fill="url(#teeth)" opacity="0.95" />
  </g>
  <line x1="0" y1="346" x2="800" y2="346" stroke="#4de3ff" stroke-width="0.8" opacity="0.5" />

  <!-- A sentence that has not been marked, sitting plain and unlit -->
  <g font-family="Maryheather, Merriweather, Georgia, serif" font-size="26" fill="#fff6e0" opacity="0.55">
    <text x="120" y="150">once.</text>
  </g>

  <!-- ...and the same sentence marked: every glyph carries its own tooth -->
  <g transform="translate(600 150) scale(1.44)">
    <text x="0" y="0" font-family="Maryheather, Merriweather, Georgia, serif" font-size="18" fill="#fff6e0" filter="url(#glow)">once.</text>
    <g fill="url(#toothGrad)" filter="url(#glow)" opacity="0.95">
      <path d="M1 6 L4 0 L7 6 Z" />
      <path d="M12 6 L15 0 L18 6 Z" />
      <path d="M23 6 L26 0 L29 6 Z" />
      <path d="M34 6 L37 0 L40 6 Z" />
      <path d="M43 6 L46 0 L49 6 Z" />
    </g>
  </g>

  <!-- P+ stamp, slightly askew like it was pressed by hand -->
  <g transform="translate(232 296) rotate(-12)" filter="url(#glow)">
    <circle cx="0" cy="0" r="30" fill="#0d0a18" stroke="url(#badgeGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="23" fill="none" stroke="url(#badgeGrad)" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 3" />
    <text x="0" y="8" text-anchor="middle"
          font-family="'Zilla Slab', Rockwell, Georgia, serif" font-weight="700" font-size="25"
          fill="url(#badgeGrad)">P+</text>
  </g>

  <!-- Caption -->
  <text x="400" y="382" text-anchor="middle" font-family="monospace" font-size="10" fill="#4de3ff" opacity="0.7" letter-spacing="3">THE MARK TRAVELS WITH THE WORDS</text>
</svg>
